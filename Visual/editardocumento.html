<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Documento</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="../JS/proteger.js" data-roles="administrador,operador"></script>
</head>
<body>
    <nav>
        <a href="admin.html">Panel</a>
        <a href="documentos.html">Volver al listado</a>
        <a href="#" id="btn-logout">Cerrar sesion</a>
    </nav>
    <h2>Editar documento</h2>
    <form id="form-editar">
        <input type="hidden" id="id" name="id">

        <p>Código QR: <strong id="codigo-qr"></strong></p>

        <label for="titulo">Título:</label>
        <input type="text" id="titulo" name="titulo" maxlength="150" required>

        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion" name="descripcion" maxlength="1000"></textarea>

        <label for="idCategoria">Categoría:</label>
        <select id="idCategoria" name="idCategoria" required></select>

        <button type="submit">Guardar cambios</button>
    </form>

    <p id="mensaje-estado"></p>
    <script src="/JS/logout.js"></script>
    <script src="/JS/editardocumento.js"></script>
</body>
</html>
