<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital de Clínicas Encuestas</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<header>
    <h1>Hospital de Clínicas</h1>
    <p>Módulo de Encuestas de Satisfacción</p>
</header>

<nav>
    <a href="index.html">Documentación</a>
    <a href="encuestas.html">Encuestas</a>
    <a href="login.html">Iniciar Sesión</a>
</nav>

<main>
<section class="panel">
    <h2>Encuesta de Satisfacción</h2>
    <form id="form-encuesta">
        <label for="servicio">Servicio utilizado</label>
        <input type="text" id="servicio" name="servicio" maxlength="100" placeholder="Ej: Laboratorio">
        <label for="calificacion">Calificación (1 a 5)</label>
        <input type="number" id="calificacion" name="calificacion" min="1" max="5">
        <label for="nombre">Nombre (Opcional)</label>
        <input type="text" id="nombre" name="nombre" maxlength="100" placeholder="Ingrese su nombre">
        <label>¿Recomendaría el servicio?</label>
        <label><input type="radio" name="recomienda" value="1"> Sí</label>
        <label><input type="radio" name="recomienda" value="0"> No</label>

        <button type="submit">Enviar Encuesta</button>
    </form>
    <p id="mensaje-estado"></p>
</section>
</main>

<script src="../JS/encuestas.js"></script>
</body>
</html>
