<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Documento</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="../JS/proteger.js" data-roles="administrador,operador"></script>
</head>
<body>
    <nav>
        <a href="admin.html">Panel</a>
        <a href="documentos.html">Volver al listado</a>
        <a href="#" id="btn-logout">Cerrar sesion</a>
    </nav>
    <h2>Agregar nuevo documento</h2>
    <form id="form-documento" enctype="multipart/form-data">
        <label for="codigoQR">Código QR:</label>
        <input type="text" id="codigoQR" name="codigoQR" maxlength="64" required>
        <label for="titulo">Título:</label>
        <input type="text" id="titulo" name="titulo" maxlength="150" required>
        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion" name="descripcion" maxlength="1000"></textarea>
        <label for="idCategoria">Categoría:</label>
        <select id="idCategoria" name="idCategoria" required>
            <option value="">Cargando...</option>
        </select>
        <label for="archivo">Archivo (PDF, JPG o PNG, máx. 2 MB):</label>
        <input type="file" id="archivo" name="archivo" accept=".pdf,.jpg,.jpeg,.png" required>
        <button type="submit">Guardar</button>
    </form>
    <p id="mensaje-estado"></p>
    <script src="../JS/logout.js"></script>
    <script src="../JS/agregardocumento.js"></script>
</body>
</html>
