<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<header>
    <h1>Hospital de Clínicas</h1>
    <p>Acceso al Sistema de Gestión</p>
</header>

<nav>
    <a href="index.HTML">Documentación</a>

<main>
    <section class="panel">
        <h2>Ingreso al Sistema</h2>
        <form id="formLogin">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" placeholder="Ingrese su usuario" required>

            <label for="clave">Contraseña</label>
            <input type="password" id="clave" placeholder="Ingrese su contraseña" required>

            <button type="submit">Ingresar</button>
        </form>
        <p id="mensaje-error"></p>
    </section>
</main>
<script src="/JS/login.js"></script>
</body>
</html>
